schema: gov-spec-driven

context: |
  全局写入纪律（适用于本仓库一切会话与任务，含不走 change 管线的直执任务、OpenSpec 各工作流阶段、桥对 tasks/backlog 的记账写）：
  1. 同一文件的多次修改必须逐次串行执行，或读取该文件最新全文后合并为一次完整编辑写入；
  2. 禁止同一文件的多个写入调用进入同一并行批次；"修改文字互不重叠"不构成并行依据——冲突判定单位是文件（写盘单位），不是文字范围；
  3. 整体写入前必须基于对文件当前实际内容的最新读取，禁止凭记忆或旧读取结果拼装全文；
  4. 批量写盘后必须做落地验证（关键词反查、抽查行号），不得默认工具返回成功即最终状态正确；
  5. 允许并行的组合仅限：不同文件的写入、一切只读操作。
  （2026-09-09 change globalize-serial-write-discipline 新增）

# Proposal rules: 统一版 16 条（2026-09-08【治理统一】change 定稿；本仓库沿用同一
# 治理规则正本；时间口径为模型处理时间，区间式禁单点，2026-09-12 add-local-compute-estimate change 增补第 16 条）
rules:
  proposal:
    - "时间估算必须给出模型处理时间范围：模型运行段（执行/独立审核/返工会话运行时长之和）合计，区间式表示，禁止单点估算制造虚假精确；不含人工确认段与等待段"
    - "难度评级（1—5）与时间估算相互独立：难度反映不确定性，时间反映投入，不得互相倒推"
    - "重要性评级对照 proposal 模板内嵌客观判据清单逐条核对，命中任一条即强制升级对应独立审核路径；J1/J3/J7 按 What Changes 与 Impact 直接判断"
    - "proposal 完整必填项以 gov-spec-driven 模板全部章节为权威硬结构，生成前先读取模板逐章核对；缺失任一章节的 proposal 不得进入等待用户授权"
    - "存在实质不同路径时最多输出简化/推荐/增强三个等级；推荐方案为满足强制验收要求的最低复杂度路径；增强方案不自动采用，需单独授权"
    - "简单优先：能用 Markdown 与人工门解决不先建服务，能单项目验证不先推广，能有界试跑不先建完整系统，能复用既有证据不重复运行；治理成本长期高于实施成本且无实质风险减少时降低对应审核深度"
    - "独立审核判定使用唯一词表：PASS / PASS_WITH_FINDINGS / FAIL / BLOCKED；BLOCKED 不推断通过或失败，只列缺失项"
    - "审1 校准循环与审2 各自独立计数，每道门最多 3 轮「独立审核 → 修改」；第 3 次独立审核仍 FAIL 即熔断停机：停止自动修复，登记失败链，转用户决策（再修 / 拆任务 / 换方案 / 回滚 / 停止）"
    - "change 实施完成后、归档前，必须在 tasks.md 的实际记录小节逐任务填写实际会话段数与近似模型处理时长区间并与估算对比；无法精确计时时记录近似区间与来源说明，偏差超出估算区间时写明原因"
    - "审核执行两门制：用户确认大原则（只看流程）即完成授权；低/中档审1、审2 由模型自动拉起独立审核并按结果自改——审1 校准（Why 意图对照、结构完整性、重要性判据清单复查），审2 完整性/正确性/一致性检查 + 证据审计与关键命令复跑（判定以复跑结果为准）；高档两道门均不自动化，流程仅提醒用户开独立会话亲自审核并将判定带回；不再逐原子任务独立审核，过程质量由执行者逐任务自检留证承担"
    - "审核模型分两档：fast（低风险审核可用）与 strong（中高风险审核必须）；审核档位不得低于执行档位；fast 审核对疑似 MAJOR 拿不准时必须升级 strong 复核后判定，不得硬判；治理规则只定义档位，不绑定具体型号，档位到型号的映射由用户现场选择"
    - "高危硬规则：change 触及金钱、密钥/凭据、删除数据、不可逆操作或跨仓库改动时，重要性评级强制至少中级，不受判据清单核对结果影响"
    - "提案前的探索沟通结论（用户原话、要/不要、边界）必须写入 proposal 的 Why 节，作为审1 校准对照依据"
    - "change 归档前必须同时满足：审2 通过且无未决 MAJOR（高档为用户独立会话审核带回判定通过）、Actuals 已填写、用户确认归档；不执行自动归档与自动 git 提交"
    - "不得为显得轻量而压低估算；估算粒度应能支撑后续 tasks.md 的任务拆分"
    - "proposal 必含「本机计算量估算」小节（Cost Estimate 下）；凡含本机执行的计算任务必须以计算式登记：数量 × 单位耗时 ÷ 并行度 = 总时长（连续计算墙钟时间，机器视角，与模型处理时间口径互不吞并），单位耗时必须注明来源（实测 / 外推 / 假设），仅以「分钟级 / 小时级」等结论词作答视为不合规；无实测来源且按任何合理假设外推总量可能超过 1 小时时，必须先执行有代表性的抽样实测（记录样本量与实测区间）再填数，不得以纯假设值直接登记；预计本机连续计算总时长 > 1 小时必须将「本机执行 / 云跑」作为显式决策点提请用户裁决，并核对登记判据 J12（本机长时计算，非高危），选云跑另按 J1（直接现金支出）判断，两判据同时命中按评级与审核路径映射升档；无本机计算任务的提案填一行「无本机计算任务」，小节不得缺失"

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
operations:
  apply:
    guidance:
      - "按已批准提案的确认契约自主执行，任务间不等待用户输入"
      - "仅当确认契约中的停止与升级条件触发时中断执行并请求用户确认"
      - "执行者逐任务自检：每完成一个原子任务即运行该任务验收命令，未编辑输出存入 evidence/ 对应目录；自检未通过不得提交"
      - "主 agent 作为桥只传递工件与证据（四件套契约、任务行、diff、未编辑命令输出、提交哈希），不传递任何一方的推理过程与辩解；桥不代审、不出判定、不代执行、不写代码，独占任务勾选表、证据索引与失败计数登记"
      - "执行与审核不同源：审核由独立会话承担，审核档位不得低于执行档位"
      - "审2 报告即返工工单：修复者逐条解决 finding 后提请复审，复审只查未解决 finding 与修复 diff；同一对象第三次 FAIL 即熔断停机转用户"
      - "执行编排粒度：桥按任务的目标、依赖与所需上下文把原子任务组织为阶段，一个阶段含一个或多个任务，不要求同文件；阶段内任务逐项串行执行、各自自检留证；阶段全部受授任务完成并回报后本会话结束，由桥拉起新的执行会话接续下阶段，不把旧会话直接续用到下阶段；阶段内上下文难以保持约束时，执行者经五件回报说明已完成与未完成项、现存部分改动和证据位置，桥可在原授权范围内提前结束会话，把剩余任务按原任务编号与原验收交新会话继续，部分完成不得勾选，交接不是宣告完成；阶段分组与提前交接原因简记于 tasks.md「Actuals 实际记录」小节，不新增日志表单；新旧执行截止：本阶段化编排语义自用户在本 Change 归档确认中一并确认采用后，对首次启动 apply 的 Change 生效，已启动执行的 Change 保持原采用合同与编排记录，不追改其任务、证据或归档"
      - "执行模式分级：低档默认主会话（聊天框）直执，中/高档默认由桥自动拉起执行会话派工（无需人操作）；偏离通道双向：原子任务 ≤3 个、或按第 7 条分组后仅含一个可独立完成的阶段时，中/高档也可直执，低档但任务多、文件面大或阶段多时也可派工；偏离必须登记理由于 tasks.md「Actuals 实际记录」小节（执行模式与偏离理由，执行期即可写）；不得仅为直执把大 Change 硬塞为一个阶段"
      - "并行判断：写入串行为默认——同一 Change 同一时刻最多 1 个写入型执行会话，阶段完成再派下一阶段，不同文件不相交也不自动并行写；同一文件的编辑在工具调用层逐次执行或合并为一次完整编辑，含桥对 tasks.md 勾选、实际记录与证据索引的记账写；只读调查仅在有具体信息缺口且结果会影响当前实施判断时启用，独立调查可并行，活跃子代理总数不超过 4（含执行会话，这是上限而非目标），无需调查时数量为 0，调查只开放只读能力、不出审核判定、不写成品与 tasks；工具链不可用或子代理异常时不静默回退直执，按例外上报规则交用户决定"
